# heeyid-callbacks: the door of the vendors' delivery reports, CALLBACKS_ADDRESS:8080, plain HTTP. The
# bank's ingress ends TLS and passes Xabar's reports here; nothing else reaches the SMS adapter's
# callback port. A request passes only when:
#   - the connection comes from the bank's ingress (CALLBACKS_INGRESS_ADDRESSES), and
#   - the address the ingress puts last in X-Forwarded-For is Xabar's (XABAR_ADDRESSES), and
#   - it is POST /delivery-reports/xabar/<secret>/status, the secret 32 to 128 URL-safe characters.
# Anything else: 403 (who), 405 (not POST) or 404 (what). The adapter checks the secret itself (a wrong one is 404).
# The log never shows the secret.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;
events { worker_connections 1024; }

http {
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  client_max_body_size 64k;
  client_body_timeout 10s;
  client_header_timeout 10s;

  # set_real_ip_from (the ingress), $from_ingress and $from_xabar: callbacks/start.sh writes them from
  # the settings (secret/env/callbacks).
  include /tmp/callbacks/addresses.conf;
  real_ip_header X-Forwarded-For;
  real_ip_recursive off; # the last address only: the one the ingress itself added
  map "$from_ingress$from_xabar" $allowed {
    11 1;
    default 0;
  }

  map $uri $logged_uri {
    ~^/delivery-reports/ /delivery-reports/***;
    default $uri;
  }
  map $remote_addr $logged { # not the healthcheck's probe, from inside the container
    127.0.0.1 0;
    default 1;
  }
  log_format callbacks '$realip_remote_addr for $remote_addr [$time_iso8601] "$request_method $logged_uri" $status $body_bytes_sent $request_time $upstream_status';
  access_log /dev/stdout callbacks if=$logged;

  # Docker's DNS, asked on each request: the adapter started later, or recreated, is found.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 8080;

    location ~ "^/delivery-reports/xabar/[A-Za-z0-9_-]{32,128}/status$" {
      if ($allowed = 0) { return 403; }
      if ($request_method != POST) { return 405; } # return, not deny: deny logs the path, secret and all
      set $adapter sms-adapter:8294; # SMS_ADAPTER_CALLBACK_PORT (vault/tofu/settings.tf)
      proxy_pass http://$adapter;
      proxy_connect_timeout 5s;
      proxy_read_timeout 10s;
    }

    location / {
      return 404;
    }
  }
}
