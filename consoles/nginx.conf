# heeyid-consoles: the consoles' one door, on CONSOLES_ADDRESS:443. It reads only the name a browser
# asks for (TLS SNI), vault.<CONSOLES_DOMAIN>, keycloak.…, grafana.…, mailpit.… (consoles/names.conf.stream-template),
# and passes the still-encrypted connection to that console, which serves its own certificate for the
# name (heeyID's CA). Any other name, or none, is refused. Logged without payloads.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;
events { worker_connections 1024; }

stream {
  log_format consoles '$remote_addr [$time_iso8601] "$ssl_preread_server_name" $upstream_addr $status $bytes_sent $bytes_received $session_time';
  # Not the healthcheck's probe, from inside the container.
  map $remote_addr $logged {
    127.0.0.1 0;
    default 1;
  }
  access_log /dev/stdout consoles if=$logged;

  # Docker's DNS, asked on each connection: a console started later, or recreated, is found.
  resolver 127.0.0.11 valid=10s ipv6=off;
  include /etc/nginx/stream-conf.d/*.conf; # the names, $console (the image writes it from the template)

  server {
    listen 8443;
    ssl_preread on;
    preread_timeout 5s;
    proxy_connect_timeout 5s;
    proxy_pass $console;
  }
}
